<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GitHub Web Editor</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --blue: #1f6feb;
    --green: #238636;
    --green-hover: #2ea043;
    --red: #da3633;
    --red-hover: #f85149;
    --yellow: #d29922;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

button,
input,
select {
    font: inherit;
}

button {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 11px;
    background: var(--panel2);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
}

button:hover {
    background: #30363d;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

button.primary {
    background: var(--green);
    border-color: var(--green);
}

button.primary:hover {
    background: var(--green-hover);
}

button.blue {
    background: var(--blue);
    border-color: var(--blue);
}

button.danger {
    background: var(--red);
    border-color: var(--red);
}

button.danger:hover {
    background: var(--red-hover);
}

input,
select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    outline: none;
}

input:focus,
select:focus {
    border-color: var(--blue);
}

/* =========================================================
   TOP BAR
   ========================================================= */

#topbar {
    height: 60px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

#repoInput {
    width: 220px;
}

#tokenInput {
    width: 270px;
}

#branchSelect {
    width: 150px;
}

#status {
    margin-left: auto;
    max-width: 330px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: 13px;
}

/* =========================================================
   MAIN LAYOUT
   ========================================================= */

#app {
    height: calc(100vh - 60px);
    display: grid;
    grid-template-columns: 245px 1fr;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

#sidebar {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--border);
}

#fileTools {
    padding: 9px;
    border-bottom: 1px solid var(--border);
}

#fileSearch {
    width: 100%;
}

#fileList {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
}

.file {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 8px;
    border-radius: 5px;
    cursor: pointer;
    font-family: Consolas, Monaco, "Courier New", monospace;
    font-size: 13px;
    word-break: break-all;
}

.file:hover {
    background: var(--panel2);
}

.file.selected {
    background: #1f6feb33;
}

.fileIcon {
    flex: none;
}

/* =========================================================
   MAIN WORKSPACE
   ========================================================= */

#main {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: 43px 1fr;
}

#toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

#currentFile {
    min-width: 0;
    margin-right: auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-family: Consolas, Monaco, "Courier New", monospace;
}

#workspace {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
}

.panel {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

.panel:first-child {
    border-right: 1px solid var(--border);
}

.panelHeader {
    height: 31px;
    flex: none;
    display: flex;
    align-items: center;
    padding: 0 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    font-weight: bold;
}

#code {
    flex: 1;
    min-height: 0;
    width: 100%;
    resize: none;
    border: 0;
    outline: 0;
    padding: 15px;
    background: #0d1117;
    color: #e6edf3;
    font-family: Consolas, Monaco, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.5;
    tab-size: 4;
}

#preview {
    flex: 1;
    width: 100%;
    min-height: 0;
    border: 0;
    background: white;
}

#previewInfo {
    padding: 7px 10px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
}

/* =========================================================
   MODAL
   ========================================================= */

#modalBackdrop {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
}

#modal {
    width: min(760px, 94vw);
    max-height: 85vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 18px;
    box-shadow: 0 20px 70px #000;
}

#modal h2 {
    margin: 0 0 15px;
}

.commit {
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 11px;
    margin-bottom: 8px;
}

.commitMessage {
    font-weight: bold;
    margin-bottom: 5px;
}

.commitMeta {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
}

.commitActions {
    margin-top: 8px;
}

.modalButtons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 15px;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 900px) {

    html,
    body {
        overflow: auto;
    }

    #topbar {
        height: auto;
        min-height: 60px;
        overflow-x: auto;
        flex-wrap: wrap;
    }

    #status {
        display: none;
    }

    #app {
        height: calc(100vh - 120px);
        min-height: 600px;
        grid-template-columns: 190px 1fr;
    }

    #workspace {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
    }

    .panel:first-child {
        border-right: 0;
        border-bottom: 1px solid var(--border);
    }
}
</style>
</head>

<body>

<!-- =======================================================
     TOP BAR
     ======================================================= -->

<header id="topbar">

    <input
        id="repoInput"
        type="text"
        placeholder="username/repository"
        autocomplete="off"
        spellcheck="false"
        aria-label="GitHub repository"
    >

    <input
        id="tokenInput"
        type="password"
        placeholder="GitHub token"
        autocomplete="off"
        spellcheck="false"
        aria-label="GitHub token"
    >

    <button
        id="loadRepoButton"
        class="blue"
        type="button"
    >
        Load Repository
    </button>

    <select
        id="branchSelect"
        disabled
        aria-label="GitHub branch"
    ></select>

    <button
        id="refreshRepoButton"
        type="button"
        disabled
    >
        ↻ Repository
    </button>

    <button
        id="githubButton"
        type="button"
        disabled
    >
        GitHub
    </button>

    <button
        id="pagesButton"
        type="button"
        disabled
    >
        Pages
    </button>

    <button
        id="clearTokenButton"
        type="button"
    >
        Clear Token
    </button>

    <span id="status">
        Ready
    </span>

</header>


<!-- =======================================================
     APP
     ======================================================= -->

<div id="app">

    <!-- SIDEBAR -->

    <aside id="sidebar">

        <div id="fileTools">

            <input
                id="fileSearch"
                type="search"
                placeholder="Search files..."
                autocomplete="off"
                spellcheck="false"
            >

        </div>

        <div id="fileList">

            <div
                style="
                    padding:10px;
                    color:#8b949e;
                    font-size:13px;
                "
            >
                Load a repository to see its files.
            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main id="main">

        <div id="toolbar">

            <span id="currentFile">
                No file selected
            </span>

            <button
                id="newFileButton"
                type="button"
                disabled
            >
                + New
            </button>

            <button
                id="deleteFileButton"
                class="danger"
                type="button"
                disabled
            >
                Delete
            </button>

            <button
                id="refreshFileButton"
                type="button"
                disabled
            >
                ↻ File
            </button>

            <button
                id="previewButton"
                type="button"
                disabled
            >
                ▶ Preview
            </button>

            <button
                id="deployButton"
                class="primary"
                type="button"
                disabled
            >
                🚀 Deploy
            </button>

            <button
                id="historyButton"
                type="button"
                disabled
            >
                History
            </button>

        </div>


        <div id="workspace">

            <!-- EDITOR -->

            <section class="panel">

                <div class="panelHeader">
                    CODE
                </div>

                <textarea
                    id="code"
                    disabled
                    spellcheck="false"
                    placeholder="Select a file from the repository..."
                ></textarea>

            </section>


            <!-- PREVIEW -->

            <section class="panel">

                <div class="panelHeader">
                    LIVE PREVIEW
                </div>

                <iframe
                    id="preview"
                    sandbox="allow-scripts allow-forms allow-modals"
                    title="Live preview"
                ></iframe>

                <div id="previewInfo">
                    Select an HTML file to preview it.
                </div>

            </section>

        </div>

    </main>

</div>


<!-- =======================================================
     MODAL
     ======================================================= -->

<div id="modalBackdrop">

    <div id="modal">

        <div id="modalContent"></div>

        <div class="modalButtons">

            <button
                id="closeModalButton"
                type="button"
            >
                Close
            </button>

        </div>

    </div>

</div>


<script>

/*
================================================================
 GitHub Web Editor
================================================================

 IMPORTANT:

 This application intentionally does NOT use:

   localStorage
   sessionStorage
   IndexedDB
   cookies

 The GitHub token exists only while this page is open.

 Reloading the page clears the JavaScript memory containing
 the token.

 The token is sent directly to GitHub's API and nowhere else.

================================================================
*/


"use strict";


// ================================================================
// APPLICATION STATE
// ================================================================

let owner = "";
let repository = "";
let token = "";

let currentBranch = "";

let currentFile = "";
let currentSHA = "";

let originalContent = "";

let files = [];

let repositoryURL = "";

let previewTimer = null;

let historyViewing = false;


// ================================================================
// DOM ELEMENTS
// ================================================================

const repoInput =
    document.getElementById("repoInput");

const tokenInput =
    document.getElementById("tokenInput");

const loadRepoButton =
    document.getElementById("loadRepoButton");

const branchSelect =
    document.getElementById("branchSelect");

const refreshRepoButton =
    document.getElementById("refreshRepoButton");

const githubButton =
    document.getElementById("githubButton");

const pagesButton =
    document.getElementById("pagesButton");

const clearTokenButton =
    document.getElementById("clearTokenButton");

const statusElement =
    document.getElementById("status");

const fileSearch =
    document.getElementById("fileSearch");

const fileList =
    document.getElementById("fileList");

const currentFileElement =
    document.getElementById("currentFile");

const code =
    document.getElementById("code");

const preview =
    document.getElementById("preview");

const previewInfo =
    document.getElementById("previewInfo");

const newFileButton =
    document.getElementById("newFileButton");

const deleteFileButton =
    document.getElementById("deleteFileButton");

const refreshFileButton =
    document.getElementById("refreshFileButton");

const previewButton =
    document.getElementById("previewButton");

const deployButton =
    document.getElementById("deployButton");

const historyButton =
    document.getElementById("historyButton");

const modalBackdrop =
    document.getElementById("modalBackdrop");

const modalContent =
    document.getElementById("modalContent");

const closeModalButton =
    document.getElementById("closeModalButton");


// ================================================================
// STATUS
// ================================================================

function setStatus(message) {

    statusElement.textContent =
        message;
}


// ================================================================
// ENABLE/DISABLE UI
// ================================================================

function updateUI() {

    const repositoryLoaded =
        Boolean(
            owner &&
            repository &&
            token
        );

    const fileSelected =
        Boolean(currentFile);


    branchSelect.disabled =
        !repositoryLoaded;

    refreshRepoButton.disabled =
        !repositoryLoaded;

    githubButton.disabled =
        !repositoryLoaded;

    pagesButton.disabled =
        !repositoryLoaded;

    newFileButton.disabled =
        !repositoryLoaded;

    deleteFileButton.disabled =
        !fileSelected;

    refreshFileButton.disabled =
        !fileSelected;

    previewButton.disabled =
        !fileSelected;

    deployButton.disabled =
        !fileSelected;

    historyButton.disabled =
        !repositoryLoaded;
}


// ================================================================
// PARSE REPOSITORY
// ================================================================

function parseRepository(value) {

    value =
        value
            .trim()
            .replace(/^https?:\/\/github\.com\//i, "")
            .replace(/\/+$/, "")
            .replace(/\.git$/i, "");


    const parts =
        value.split("/");


    if (parts.length !== 2) {

        throw new Error(
            "Repository must look like username/repository."
        );
    }


    const parsedOwner =
        parts[0].trim();

    const parsedRepository =
        parts[1].trim();


    if (
        !parsedOwner ||
        !parsedRepository
    ) {

        throw new Error(
            "Invalid repository name."
        );
    }


    return {
        owner: parsedOwner,
        repository: parsedRepository
    };
}


// ================================================================
// GITHUB API REQUEST
// ================================================================

async function githubRequest(
    url,
    options = {}
) {

    if (!token) {

        throw new Error(
            "No GitHub token has been entered."
        );
    }


    const headers = {

        "Accept":
            "application/vnd.github+json",

        "Authorization":
            "Bearer " + token,

        "X-GitHub-Api-Version":
            "2022-11-28",

        ...(options.headers || {})
    };


    let response;


    try {

        response =
            await fetch(
                url,
                {
                    ...options,
                    headers
                }
            );

    }
    catch (error) {

        throw new Error(
            "Could not connect to GitHub. " +
            "If you opened this file directly with file://, " +
            "try opening it through a local web server."
        );
    }


    if (!response.ok) {

        let message =
            "GitHub API request failed.";


        try {

            const data =
                await response.json();

            if (data && data.message) {
                message = data.message;
            }

        }
        catch (_) {
            // Ignore invalid error body.
        }


        throw new Error(
            response.status +
            " - " +
            message
        );
    }


    return response;
}


// ================================================================
// LOAD REPOSITORY
// ================================================================

async function loadRepository() {

    const repositoryText =
        repoInput.value.trim();

    const suppliedToken =
        tokenInput.value.trim();


    if (!repositoryText) {

        alert(
            "Enter a GitHub repository.\n\n" +
            "Example:\n" +
            "username/my-site"
        );

        return;
    }


    if (!suppliedToken) {

        alert(
            "Enter your GitHub token."
        );

        return;
    }


    try {

        const parsed =
            parseRepository(
                repositoryText
            );


        owner =
            parsed.owner;

        repository =
            parsed.repository;

        token =
            suppliedToken;


        currentFile = "";
        currentSHA = "";
        originalContent = "";
        historyViewing = false;


        code.value = "";

        code.disabled = true;

        preview.srcdoc = "";

        currentFileElement.textContent =
            "No file selected";


        setStatus(
            "Checking repository..."
        );


        /*
            Retrieve repository information first.
        */

        const repositoryResponse =
            await githubRequest(
                "https://api.github.com/repos/" +
                encodeURIComponent(owner) +
                "/" +
                encodeURIComponent(repository)
            );


        const repositoryData =
            await repositoryResponse.json();


        repositoryURL =
            repositoryData.html_url;


        /*
            Load branches.
        */

        await loadBranches(
            repositoryData.default_branch
        );


        /*
            Load files.
        */

        await loadFiles();


        updateUI();


        setStatus(
            files.length +
            " file(s) loaded"
        );

    }
    catch (error) {

        console.error(error);

        setStatus(
            "Repository load failed"
        );


        alert(
            "Could not load repository.\n\n" +
            error.message
        );
    }
}


// ================================================================
// LOAD BRANCHES
// ================================================================

async function loadBranches(
    defaultBranch
) {

    setStatus(
        "Loading branches..."
    );


    const response =
        await githubRequest(
            "https://api.github.com/repos/" +
            encodeURIComponent(owner) +
            "/" +
            encodeURIComponent(repository) +
            "/branches?per_page=100"
        );


    const branches =
        await response.json();


    branchSelect.innerHTML = "";


    if (!Array.isArray(branches) ||
        branches.length === 0) {

        throw new Error(
            "No branches were returned."
        );
    }


    for (
        const branch of branches
    ) {

        const option =
            document.createElement("option");


        option.value =
            branch.name;

        option.textContent =
            branch.name;


        branchSelect.appendChild(
            option
        );
    }


    let selectedBranch =
        defaultBranch;


    if (
        !branches.some(
            branch =>
                branch.name === selectedBranch
        )
    ) {

        if (
            branches.some(
                branch =>
                    branch.name === "main"
            )
        ) {

            selectedBranch = "main";

        }
        else {

            selectedBranch =
                branches[0].name;
        }
    }


    currentBranch =
        selectedBranch;

    branchSelect.value =
        selectedBranch;
}


// ================================================================
// BRANCH CHANGED
// ================================================================

branchSelect.addEventListener(
    "change",
    async function () {

        const oldFile =
            currentFile;


        if (
            currentFile &&
            code.value !== originalContent
        ) {

            const confirmed =
                confirm(
                    "You have unsaved changes.\n\n" +
                    "Changing branches will discard those changes.\n\n" +
                    "Continue?"
                );


            if (!confirmed) {

                branchSelect.value =
                    currentBranch;

                return;
            }
        }


        currentBranch =
            branchSelect.value;


        currentFile = "";
        currentSHA = "";
        originalContent = "";
        historyViewing = false;


        code.value = "";

        code.disabled = true;

        preview.srcdoc = "";

        currentFileElement.textContent =
            "No file selected";


        try {

            await loadFiles();

            setStatus(
                "Switched to " +
                currentBranch
            );

        }
        catch (error) {

            alert(
                "Could not load branch:\n\n" +
                error.message
            );
        }
    }
);


// ================================================================
// LOAD ALL FILES
// ================================================================

async function loadFiles() {

    setStatus(
        "Loading repository files..."
    );


    const response =
        await githubRequest(
            "https://api.github.com/repos/" +
            encodeURIComponent(owner) +
            "/" +
            encodeURIComponent(repository) +
            "/git/trees/" +
            encodeURIComponent(currentBranch) +
            "?recursive=1"
        );


    const data =
        await response.json();


    if (
        data.truncated
    ) {

        alert(
            "GitHub reported that the repository tree is too large " +
            "and was truncated. Some files may not appear."
        );
    }


    files =
        (data.tree || [])
            .filter(
                item =>
                    item.type === "blob"
            )
            .map(
                item => ({
                    path: item.path,
                    sha: item.sha
                })
            )
            .sort(
                (a, b) =>
                    a.path.localeCompare(
                        b.path
                    )
            );


    renderFiles();
}


// ================================================================
// RENDER FILE LIST
// ================================================================

function renderFiles() {

    const search =
        fileSearch.value
            .trim()
            .toLowerCase();


    fileList.innerHTML = "";


    const visibleFiles =
        files.filter(
            file =>
                file.path
                    .toLowerCase()
                    .includes(search)
        );


    if (
        visibleFiles.length === 0
    ) {

        const empty =
            document.createElement("div");


        empty.style.padding =
            "10px";

        empty.style.color =
            "#8b949e";

        empty.style.fontSize =
            "13px";

        empty.textContent =
            files.length === 0
                ? "No files found."
                : "No matching files.";


        fileList.appendChild(
            empty
        );

        return;
    }


    for (
        const file of visibleFiles
    ) {

        const element =
            document.createElement("div");


        element.className =
            "file";


        if (
            file.path === currentFile
        ) {

            element.classList.add(
                "selected"
            );
        }


        const icon =
            document.createElement("span");


        icon.className =
            "fileIcon";

        icon.textContent =
            getFileIcon(
                file.path
            );


        const name =
            document.createElement("span");


        name.textContent =
            file.path;


        element.appendChild(
            icon
        );

        element.appendChild(
            name
        );


        element.addEventListener(
            "click",
            function () {

                selectFile(
                    file.path
                );
            }
        );


        fileList.appendChild(
            element
        );
    }
}


// ================================================================
// SEARCH FILES
// ================================================================

fileSearch.addEventListener(
    "input",
    renderFiles
);


// ================================================================
// SELECT FILE
// ================================================================

async function selectFile(
    path
) {

    if (
        currentFile &&
        code.value !== originalContent
    ) {

        const confirmed =
            confirm(
                "You have unsaved changes.\n\n" +
                "Selecting another file will discard them.\n\n" +
                "Continue?"
            );


        if (!confirmed) {
            return;
        }
    }


    await loadFile(
        path,
        true
    );
}


// ================================================================
// LOAD FILE
// ================================================================

async function loadFile(
    path,
    updateStatus = true
) {

    try {

        if (updateStatus) {

            setStatus(
                "Loading " + path + "..."
            );
        }


        const response =
            await githubRequest(
                "https://api.github.com/repos/" +
                encodeURIComponent(owner) +
                "/" +
                encodeURIComponent(repository) +
                "/contents/" +
                encodeGitHubPath(path) +
                "?ref=" +
                encodeURIComponent(currentBranch)
            );


        const data =
            await response.json();


        if (
            data.type !== "file"
        ) {

            throw new Error(
                "GitHub did not return a file."
            );
        }


        const content =
            decodeBase64UTF8(
                data.content || ""
            );


        currentFile =
            path;

        currentSHA =
            data.sha;

        originalContent =
            content;

        historyViewing =
            false;


        code.disabled =
            false;

        code.value =
            content;


        currentFileElement.textContent =
            path;


        renderFiles();

        updateUI();

        previewCurrentFile();


        if (updateStatus) {

            setStatus(
                "Loaded " + path
            );
        }

    }
    catch (error) {

        console.error(error);

        alert(
            "Could not load file:\n\n" +
            error.message
        );

        setStatus(
            "File load failed"
        );
    }
}

        code.value !== originalContent
    ) {

        const confirmed =
            confirm(

        if (!confirmed) {
            return;
        }
    }


    await loadFile(
        currentFile,
        true
    );
}


// ================================================================
// PREVIEW CURRENT FILE
// ================================================================

function previewCurrentFile() {

    if (!currentFile) {

        preview.srcdoc = "";

        previewInfo.textContent =
            "Select an HTML file to preview it.";

        return;
    }


    const extension =
        getExtension(
            currentFile
        );


    if (
        extension === "html" ||
        extension === "htm"
    ) {

        /*
            srcdoc means the HTML is previewed immediately
            without deploying it first.
        */

        preview.srcdoc =
            code.value;


        previewInfo.textContent =
            "Live preview of " +
            currentFile;


        return;
    }


    if (
        extension === "css"
    ) {

        preview.srcdoc =
            createCSSPreview(
                code.value
            );


        previewInfo.textContent =
            "CSS preview — deploy the stylesheet to use it from your site.";

        return;
    }


    if (
        extension === "js"
    ) {

        preview.srcdoc =
            createJSPreview(
                code.value
            );


        previewInfo.textContent =
            "JavaScript preview — the script is executed in an isolated preview.";

        return;
    }


    preview.srcdoc =
        createTextPreview(
            currentFile,
            code.value
        );


    previewInfo.textContent =
        "This file type does not have a full webpage preview.";
}

// ================================================================

// ================================================================

async function createFile() {

    if (!owner || !repository) {

        alert(
            "Load a repository first."
        );

        return;
    }


    const path =
        prompt(
            "New file path:\n\n" +
            "Examples:\n" +
            "about.html\n" +
            "css/style.css\n" +
            "js/app.js"
        );


    if (!path) {
        return;
    }


    const cleanPath =
        path.trim();


    if (!cleanPath) {
        return;
    }


    if (
        cleanPath.startsWith("/")
    ) {

        alert(
            "Use a relative repository path."
        );

        return;
    }


    const alreadyExists =
        files.some(
            file =>
                file.path === cleanPath
        );


    if (alreadyExists) {

        alert(
            "That file already exists."
        );

        return;
    }


    currentFile =
        cleanPath;

    currentSHA =
        "";

    originalContent =
        "";

    historyViewing =
        false;


    code.disabled =
        false;

    code.value =
        "";


    currentFileElement.textContent =
        cleanPath;


    renderFiles();

    updateUI();

    previewCurrentFile();

    setStatus(
        "New file: " + cleanPath
    );


    code.focus();
}


// ================================================================
// DELETE FILE
// ================================================================

async function deleteFile() {

    if (!currentFile) {

        alert(
            "Select a file first."
        );

        return;
    }


    const confirmed =
        confirm(
            "Delete this file?\n\n" +
            currentFile +
            "\n\n" +
            "This will create a GitHub commit and remove the file."
        );


    if (!confirmed) {
        return;
    }


    try {

        setStatus(
            "Checking latest file version..."
        );


        /*
            Always retrieve the latest SHA immediately
            before deleting.
        */

        const response =
            await githubRequest(
                "https://api.github.com/repos/" +
                encodeURIComponent(owner) +
                "/" +
                encodeURIComponent(repository) +
                "/contents/" +
                encodeGitHubPath(currentFile) +
                "?ref=" +
                encodeURIComponent(currentBranch)
            );


        const data =
            await response.json();


        const sha =
            data.sha;


        setStatus(
            "Deleting " +
            currentFile +
            "..."
        );


        await githubRequest(
            "https://api.github.com/repos/" +
            encodeURIComponent(owner) +
            "/" +
            encodeURIComponent(repository) +
            "/contents/" +
            encodeGitHubPath(currentFile),
            {
                method: "DELETE",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    message:
                        "Delete " +
                        currentFile,

                    sha:
                        sha,

                    branch:
                        currentBranch
                })
            }
        );


        const deletedFile =
            currentFile;


        currentFile = "";
        currentSHA = "";
        originalContent = "";
        historyViewing = false;


        code.value =
            "";

        code.disabled =
            true;


        currentFileElement.textContent =
            "No file selected";


        preview.srcdoc =
            "";


        previewInfo.textContent =
            "Select an HTML file to preview it.";


        await loadFiles();


        updateUI();


        setStatus(
            "Deleted " +
            deletedFile
        );

    }
    catch (error) {

        console.error(error);

        alert(
            "Could not delete the file:\n\n" +
            error.message
        );

        setStatus(
            "Delete failed"
        );
    }
}


// ================================================================
// DEPLOY CURRENT FILE
// ================================================================

async function deployCurrentFile() {

    if (!currentFile) {

        alert(
            "Select a file first."
        );

        return;
    }


    /*
        If the user loaded an older commit into the editor,
        warn them before using it to overwrite the current file.
    */

    if (historyViewing) {

        const rollback =
            confirm(
                "You are viewing an older version of this file.\n\n" +
                "Deploying now will replace the current file with that older version.\n\n" +
                "Continue?"
            );


        if (!rollback) {
            return;
        }
    }


    const newContent =
        code.value;


    try {

        setStatus(
            "Checking latest GitHub version..."
        );


        let latestSHA =
            "";


        /*
            Determine whether this is a new file.
        */

        const existingFile =
            files.some(
                file =>
                    file.path === currentFile
            );


        if (existingFile) {

            const response =
                await githubRequest(
                    "https://api.github.com/repos/" +
                    encodeURIComponent(owner) +
                    "/" +
                    encodeURIComponent(repository) +
                    "/contents/" +
                    encodeGitHubPath(currentFile) +
                    "?ref=" +
                    encodeURIComponent(currentBranch)
                );


            const data =
                await response.json();


            latestSHA =
                data.sha;
        }


        /*
            If the content hasn't changed, let the user decide
            whether they still want a new commit.
        */

        if (
            existingFile &&
            newContent === originalContent
        ) {

            const confirmed =
                confirm(
                    "The file has not changed.\n\n" +
                    "Create a new GitHub commit anyway?"
                );


            if (!confirmed) {
                return;
            }
        }


        setStatus(
            "Deploying " +
            currentFile +
            "..."
        );


        const body = {

            message:
                existingFile
                    ? "Update " + currentFile
                    : "Create " + currentFile,

            content:
                encodeBase64UTF8(
                    newContent
                ),

            branch:
                currentBranch
        };


        /*
            Existing files require SHA.
            New files do not.
        */

        if (latestSHA) {

            body.sha =
                latestSHA;
        }


        const response =
            await githubRequest(
                "https://api.github.com/repos/" +
                encodeURIComponent(owner) +
                "/" +
                encodeURIComponent(repository) +
                "/contents/" +
                encodeGitHubPath(currentFile),
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body)
                }
            );


        const result =
            await response.json();


        originalContent =
            newContent;

        historyViewing =
            false;


        if (
            result.content &&
            result.content.sha
        ) {

            currentSHA =
                result.content.sha;
        }


        /*
            Refresh file tree so a newly-created file
            appears immediately.
        */

        await loadFiles();


        /*
            GitHub's response may contain the commit URL.
        */

        const commitURL =
            result.commit &&
            result.commit.html_url;


        if (commitURL) {

            setStatus(
                "✅ Deployed successfully"
            );

        }
        else {

            setStatus(
                "✅ Deployment complete"
            );
        }


        setTimeout(
            function () {

                if (
                    statusElement.textContent
                        .includes("Deployed") ||
                    statusElement.textContent
                        .includes("Deployment complete")
                ) {

                    setStatus(
                        "Ready"
                    );
                }

            },
            5000
        );

    }
    catch (error) {

        console.error(error);

        alert(
            "Deployment failed:\n\n" +
            error.message +
            "\n\n" +
            "GitHub may have rejected the operation because " +
            "of permissions, branch protection, or a conflicting change."
        );


        setStatus(
            "Deployment failed"
        );
    }
}

// ================================================================
// RENDER HISTORY
// ================================================================

function renderHistory(
    commits
) {

    let title;


    if (currentFile) {

        title =
            "History: " +
            escapeHTML(
                currentFile
            );

    }
    else {

        title =
            "Repository History";
    }


    let html =
        "<h2>" +
        title +
        "</h2>";


    if (
        !Array.isArray(commits) ||
        commits.length === 0
    ) {

        html +=
            "<p>No commits found.</p>";

        modalContent.innerHTML =
            html;

        return;
    }


    for (
        const commit of commits
    ) {

        const message =
            commit.commit &&
            commit.commit.message
                ? commit.commit.message
                    .split("\n")[0]
                : "No commit message";


        const author =
            commit.commit &&
            commit.commit.author &&
            commit.commit.author.name
                ? commit.commit.author.name
                : "Unknown";


        const date =
            commit.commit &&
            commit.commit.author &&
            commit.commit.author.date
                ? new Date(
                    commit.commit.author.date
                ).toLocaleString()
                : "Unknown date";


        const sha =
            commit.sha || "";


        const safeMessage =
            escapeHTML(
                message
            );


        const safeAuthor =
            escapeHTML(
                author
            );


        const safeDate =
            escapeHTML(
                date
            );


        const shortSHA =
            escapeHTML(
                sha.substring(
                    0,
                    12
                )
            );


        html += `
            <div class="commit">

                <div class="commitMessage">
                    ${safeMessage}
                </div>

                <div class="commitMeta">
                    ${safeAuthor}
                    ·
                    ${safeDate}
                    <br>
                    Commit:
                    ${shortSHA}
                </div>

                <div class="commitActions">
                    ${
                        currentFile
                            ? `
                                <button
                                    type="button"
                                    data-history-sha="${escapeAttribute(sha)}"
                                    class="loadHistoryButton"
                                >
                                    Load This Version
                                </button>
                              `
                            : ""
                    }
                </div>

            </div>
        `;
    }


    modalContent.innerHTML =
        html;


    const historyButtons =
        document.querySelectorAll(
            ".loadHistoryButton"
        );


    historyButtons.forEach(
        button => {

            button.addEventListener(
                "click",
                function () {

                    const sha =
                        button.getAttribute(
                            "data-history-sha"
                        );


                    closeModal();

                    loadHistoricalVersion(
                        sha
                    );
                }
            );
        }
    );
}


// ================================================================
// LOAD HISTORICAL VERSION
// ================================================================

async function loadHistoricalVersion(
    commitSHA
) {

    if (!currentFile) {

        return;
    }


    try {

        setStatus(
            "Loading historical version..."
        );


        const response =
            await githubRequest(
                "https://api.github.com/repos/" +
                encodeURIComponent(owner) +
                "/" +
                encodeURIComponent(repository) +
                "/contents/" +
                encodeGitHubPath(currentFile) +
                "?ref=" +
                encodeURIComponent(commitSHA)
            );


        const data =
            await response.json();


        const historicalContent =
            decodeBase64UTF8(
                data.content || ""
            );


        code.value =
            historicalContent;


        /*
            We deliberately keep the current file SHA
            separate. Deploying later will first retrieve
            the current SHA from GitHub.
        */

        historyViewing =
            true;


        currentFileElement.textContent =
            currentFile +
            "  [HISTORICAL VERSION]";


        previewCurrentFile();


        setStatus(
            "Viewing commit " +
            commitSHA.substring(0, 12)
        );

    }
    catch (error) {

        alert(
            "Could not load historical version:\n\n" +
            error.message
        );
    }
}

// ================================================================
// BASE64 UTF-8 ENCODING
// ================================================================

function encodeBase64UTF8(
    text
) {

    const bytes =
        new TextEncoder()
            .encode(text);


    let binary = "";


    for (
        const byte of bytes
    ) {

        binary +=
            String.fromCharCode(
                byte
            );
    }


    return btoa(
        binary
    );
}


// ================================================================
// BASE64 UTF-8 DECODING
// ================================================================

function decodeBase64UTF8(
    base64
) {

    /*
        GitHub Base64 responses can contain whitespace
        and line breaks.
    */

    const cleaned =
        String(base64)
            .replace(/\s/g, "");


    const binary =
        atob(cleaned);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);
    }


    return new TextDecoder(
        "utf-8"
    ).decode(
        bytes
    );
}


// ================================================================
// GITHUB PATH ENCODING
// ================================================================

function encodeGitHubPath(
    path
) {

    /*
        Encode each path component separately so that
        repository folders remain path separators.

        Example:

        css/style.css

        becomes:

        css/style.css

        with each component safely URL encoded.
    */

    return path
        .split("/")
        .map(
            part =>
                encodeURIComponent(part)
        )
        .join("/");
}


// ================================================================
// FILE EXTENSION
// ================================================================

function getExtension(
    filename
) {

    const lastDot =
        filename.lastIndexOf(".");


    if (
        lastDot === -1
    ) {

        return "";
    }


    return filename
        .substring(
            lastDot + 1
        )
        .toLowerCase();
}

// ================================================================
// HTML ESCAPING
// ================================================================

function escapeHTML(
    value
) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


// ================================================================
// HTML ATTRIBUTE ESCAPING
// ================================================================

function escapeAttribute(
    value
) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        );
}
